# CI: the staleness suite, on every push and PR.
#
# No `npm install` on purpose — this package has zero dependencies, so there is nothing to
# install and nothing for a compromised registry to inject. The checks run on node built-ins.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: generated outputs are current
        run: node scripts/build.mjs --check
      - name: staleness suite
        run: node --test test/
